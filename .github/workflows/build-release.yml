name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to only upload the jar as an artifact.'
        required: false
        default: ''

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermedia-nativepatch
          path: release/*.jar

      - name: Create GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: release/*.jar
          generate_release_notes: true
